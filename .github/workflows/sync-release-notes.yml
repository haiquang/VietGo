name: Sync Release Notes

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/releases/v*.md"
      - ".github/workflows/sync-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync GitHub Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update existing GitHub Releases from docs/releases/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for file in docs/releases/v*.md; do
            tag="$(basename "$file" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Updating release notes for $tag from $file"
              gh release edit "$tag" --title "VietGo ${tag}" --notes-file "$file"
            else
              echo "Skipping $tag (release not found)"
            fi
          done
