name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS Release
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode / Swift 6 toolchain
        run: |
          if ! swift --version | grep -q 'Swift version 6'; then
            LATEST_XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -n "$LATEST_XCODE" ]]; then
              sudo xcode-select -s "$LATEST_XCODE"
            fi
          fi
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Package release artifacts
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            REL_VER="${RELEASE_TAG#v}"
          else
            REL_VER="$(tr -d '[:space:]' < VERSION)"
            RELEASE_TAG="v${REL_VER}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "REL_VER=${REL_VER}" >> "$GITHUB_ENV"
          VIETGO_VERSION="$REL_VER" bash scripts/package_release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="dist/VietGo-v${REL_VER}-macos-arm64.dmg"
          ZIP="dist/VietGo-v${REL_VER}-macos-arm64.zip"
          SUMS="dist/SHA256SUMS.txt"
          NOTES_FILE="docs/releases/${RELEASE_TAG}.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG" "$ZIP" "$SUMS" --clobber
            if [[ -f "$NOTES_FILE" ]]; then
              gh release edit "$RELEASE_TAG" --title "VietGo ${RELEASE_TAG}" --notes-file "$NOTES_FILE"
            fi
          else
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "$RELEASE_TAG" "$DMG" "$ZIP" "$SUMS" --title "VietGo ${RELEASE_TAG}" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" "$DMG" "$ZIP" "$SUMS" --title "VietGo ${RELEASE_TAG}" --generate-notes
            fi
          fi

      - name: Update Homebrew Cask on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_SHA256="$(awk '/\.dmg$/ {print $1}' dist/SHA256SUMS.txt)"
          if [[ -f Casks/vietgo.rb && -n "$DMG_SHA256" ]]; then
            git fetch origin main
            git checkout -B main origin/main
            REL_VER="$REL_VER" DMG_SHA256="$DMG_SHA256" python3 - << 'PY'
          import os, pathlib, re
          p = pathlib.Path("Casks/vietgo.rb")
          text = p.read_text(encoding="utf-8")
          text = re.sub(r'(^\s*version\s+)".*?"', f'\\1"{os.environ["REL_VER"]}"', text, count=1, flags=re.M)
          text = re.sub(r'(^\s*sha256\s+)".*?"', f'\\1"{os.environ["DMG_SHA256"]}"', text, count=1, flags=re.M)
          p.write_text(text, encoding="utf-8")
          PY
            if ! git diff --quiet Casks/vietgo.rb; then
              git config user.name "VietGo"
              git config user.email "vietgo@users.noreply.github.com"
              git add Casks/vietgo.rb
              git commit -m "chore(brew): update cask to v${REL_VER}"
              git push origin main
            fi
          fi
